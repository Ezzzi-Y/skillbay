[project]
name = "skillbay"
version = "0.1.0"
description = "Pluggable skill middleware for LangChain agents: Claude Code's skill system re-engineered for backend services."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0.1"]

[dependency-groups]
dev = [
    "pyyaml>=6.0.1",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillbay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["skillbay"]
